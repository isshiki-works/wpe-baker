[usage]
public-include-directories = [
  "third_party",
  "src",
  "src/Scene",
  "src/Scene/Scene",
  "src/Scene/Particle",
  "src/Scene/Script",
  "src/Scene/VulkanRender",
]
public-definitions = [
  'WAYWALLEN_WORKSHOP_DIR="workshop"',
  'WAYWALLEN_ASSETS_DIR="assets"',
]
options = [
  "-Wextra",
  "-Wno-missing-field-initializers",
  "-Wno-gnu-zero-variadic-macro-arguments",
]

[dependencies.owe-core]
workspace = true
visibility = "public"

[dependencies.owe-audio]
workspace = true
visibility = "public"

[dependencies.owe-types]
workspace = true
visibility = "public"

[dependencies.owe-utils]
workspace = true
visibility = "public"

[dependencies.owe-vulkan]
workspace = true
visibility = "public"

[dependencies.rstd-std]
workspace = true
visibility = "public"

[dependencies.rstd-cppstd]
workspace = true
visibility = "public"

[dependencies.rstd-json]
workspace = true
visibility = "public"

[dependencies.rstd-log]
workspace = true
visibility = "public"

[dependencies.rstd-argparse]
workspace = true
visibility = "public"

[dependencies.rstd-bench]
workspace = true
visibility = "public"

[dependencies.wavsen]
workspace = true
visibility = "public"

[external-dependencies.cmake.quickjs]
workspace = true
targets = [{ name = "qjs", visibility = "public" }]

[external-dependencies.pkg-config.lz4]
workspace = true
visibility = "public"

[external-dependencies.pkg-config.fontconfig]
workspace = true
visibility = "public"
condition = 'target.family == "unix"'

[external-dependencies.pkg-config.freetype]
workspace = true
visibility = "public"

[[when]]
condition = 'target.os == "windows"'
[when.usage]
system-libraries = ["dwrite"]
